,\"href\":\"https://wolfy.net\"}],[\"$\",\"link\",null,{\"href\":\"https://fonts.googleapis.com/css?family=Montserrat:300,400,400i,500,600,700,800|Fira+Sans:400,600|Lora:400,400i,700|Indie+Flower|Roboto:300,300i,400,400i,500,700\",\"rel\":\"stylesheet\"}],[\"$\",\"script\",null,{\"async\":true,\"src\":\"https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js\"}]]}],[\"$\",\"body\",null,{\"suppressHydrationWarning\":true,\"children\":[\"$\",\"$L11\",null,{\"lang\":\"fr\",\"namespaces\":[\"common\"],\"resources\":{\"fr\":{\"common\":{\"title\":\"Wolfy\",\"pageTitle\":\"Jeu de Loup-Garou en ligne multijoueur\",\"head\":{\"description\":\"Chaque partie sur Wolfy, tu incarnes un rôle avec différents pouvoirs. Démêle les manipulations des faits sincères afin de protéger le village des Loups-Garous.\",\"twitterDescription\":\"Lance-toi dans une partie de Loups-Garous.\"},\"errorPage\":{\"pageNotFound\":\"Page introuvable\",\"error\":\"Erreur\",\"backHome\":\"Retourner à l'accueil\"},\"moon\":\"Lune\",\"coin\":\"Pièce\",\"alpha\":\"Alpha\",\"close\":\"Fermer\",\"validate\":\"Valider\",\"cancel\":\"Annuler\",\"back\":\"Retour\",\"moonPass\":\"Moon Pass\",\"assetsAlt\":{\"arrowLongLeft\":\"Slide vers la gauche\",\"arrowLongRight\":\"Slide vers la droite\",\"avatar\":\"Avatar\",\"character\":\"Personnage\",\"cuteSkullRed\":\"Joueur mort\",\"downloadAppstore\":\"Télécharger sur l'Apple Store\",\"downloadPlay\":\"Télécharger sur Google Play\",\"elo\":\"Lauriers\",\"hourglass\":\"Timer\",\"logo\":\"Logo Wolfy\",\"mockup\":\"Mockup\",\"mouse\":\"Souris\",\"platformDark\":\"Plateforme\",\"playButton\":\"Jouer au loup-garou\",\"podium\":\"Podium\",\"refreshArrow\":\"Répéter l'animation\",\"roundedDash\":\"Cadre\",\"scene\":\"Scène\",\"scrollDown\":\"Scroll\",\"skin\":\"Skin\"},\"role\":{\"list\":{\"blackWolf\":{\"description\":\"La nuit, il se réveille avec les autres Loups-Garous. Une seule fois dans la partie, il peut infecter une victime en Loup-Garou.\",\"goal\":\"Vaincre les villageois.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-loup-noir-18eqomd/\",\"helpTitle\":\"Comment jouer le Loup Noir ?\",\"name\":\"Loup Noir\"},\"cupid\":{\"description\":\"La première nuit, il désigne deux joueurs comme Amoureux. Si l'un d'eux meurt, l'autre le suivra dans sa tombe.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-cupidon-j6w456/\",\"helpTitle\":\"Comment jouer le Cupidon ?\",\"name\":\"Cupidon\"},\"dictator\":{\"description\":\"Une fois dans la partie, il peut prendre le contrôle du vote du village. S'il fait exécuter un Loup-Garou, il devient Maire. Sinon, il meurt.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-dictateur-1fzbatc/\",\"helpTitle\":\"Comment jouer le Dictateur ?\",\"name\":\"Dictateur\"},\"gravedigger\":{\"description\":\"À sa mort, le Fossoyeur creuse la tombe d'un joueur de son choix et annonce son nom ainsi que celui d'un joueur aléatoire du camp opposé, révélant ainsi un Loup-Garou parmi eux.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-fossoyeur-bfxwr/\",\"helpTitle\":\"Comment jouer le Fossoyeur ?\",\"name\":\"Fossoyeur\"},\"guard\":{\"description\":\"Chaque nuit, il protège un joueur d'une éventuelle attaque des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-garde-wfyyyv/\",\"helpTitle\":\"Comment jouer le Garde ?\",\"name\":\"Garde\"},\"heir\":{\"description\":\"La première nuit, il désigne un joueur qui lui lèguera son rôle à sa mort.\",\"goal\":\"Vaincre les Loups-Garous tant qu'il ne reçoit pas de nouveau rôle.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-lheritier-1xyp9n7/\",\"helpTitle\":\"Comment jouer l'Héritier ?\",\"name\":\"Héritier\"},\"plunderer\":{\"description\":\"Il obtient le rôle du premier joueur mort et peut utiliser ses pouvoirs pour le reste de la partie.\",\"goal\":\"Vaincre les Loups-Garous tant qu'il ne reçoit pas de nouveau rôle.\",\"name\":\"Pillard\"},\"hunter\":{\"description\":\"À sa mort, il peut choisir un autre joueur à entraîner avec lui dans la tombe.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-chasseur-nvabl5/\",\"helpTitle\":\"Comment jouer le Chasseur ?\",\"name\":\"Chasseur\"},\"littleGirl\":{\"description\":\"La nuit, elle espionne discrètement les Loups-Garous pendant leurs discussions.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-la-petite-fille-seetxt/\",\"helpTitle\":\"Comment jouer la Petite Fille ?\",\"name\":\"Petite Fille\"},\"mentalist\":{\"description\":\"Il perçoit l'issue du vote du village 30 secondes avant sa fin et communique si elle est favorable ou non.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-mentaliste-1ewmwy1/\",\"helpTitle\":\"Comment jouer le Mentaliste ?\",\"name\":\"Mentaliste\"},\"mercenary\":{\"description\":\"Le premier jour, son but est de tuer la cible qui lui est attribuée. S'il réussit, il gagne la partie instantanément. Sinon, il devient villageois.\",\"goal\":\"Éliminer sa cible, ou vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-mercenaire-n90rj6/\",\"helpTitle\":\"Comment jouer le Mercenaire ?\",\"name\":\"Mercenaire\"},\"necromencer\":{\"description\":\"La nuit, il peut communiquer avec les morts pour obtenir des informations précieuses.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-necromancien-14brfr8/\",\"helpTitle\":\"Comment jouer le Nécromancien ?\",\"name\":\"Nécromancien\"},\"pyromancer\":{\"description\":\"Chaque nuit, il a le choix entre entreposer un tonneau de feu grégeois chez un joueur, ou déclencher leur explosion.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-pyromancien-11rvc0r/\",\"helpTitle\":\"Comment jouer le Pyromancien ?\",\"name\":\"Pyromancien\"},\"redRidingHood\":{\"description\":\"Tant que le Chasseur est en vie, elle est protégée contre les attaques des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-chaperon-rouge-1v0h5k0/\",\"helpTitle\":\"Comment jouer le Chaperon Rouge ?\",\"name\":\"Chaperon Rouge\"},\"pinkRidingHood\":{\"description\":\"Tant que le couple est en vie, elle est protégée contre les attaques des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Chaperon Rose\"},\"blueRidingHood\":{\"description\":\"Tant qu'un villageois est en vie, il est protégé contre les attaques des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Chaperon Bleu\"},\"wolfRidingHood\":{\"description\":\"Tant que le Loup Noir est en vie, elle est protégée contre les votes des villageois.\",\"goal\":\"Vaincre les villageois.\",\"name\":\"Chaperon Loup\"},\"seer\":{\"description\":\"Chaque nuit elle peut découvrir le rôle d'un joueur qu'elle aura choisi. Elle doit aider les villageois sans se faire démasquer.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-la-voyante-1903qy5/\",\"helpTitle\":\"Comment jouer la Voyante ?\",\"name\":\"Voyante\"},\"talkativeSeer\":{\"description\":\"Chaque nuit, elle découvre le rôle d'un joueur et le révèle automatiquement à tout le village au lever du jour.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Voyante Bavarde\"},\"auraSeer\":{\"description\":\"Chaque nuit, la Voyante d'Aura peut connaître l'Aura d'un joueur. Une Aura obscure indique un rôle capable de tuer.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Voyante d'Aura\"},\"sickRat\":{\"description\":\"Chaque nuit, il peut contaminer deux joueurs. Il gagne la partie lorsque tous les joueurs sont atteints par la maladie.\",\"goal\":\"Contaminer tous les joueurs.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-rat-malade-v2gji3/\",\"helpTitle\":\"Comment jouer le Rat Malade ?\",\"name\":\"Rat Malade\"},\"talkativeWolf\":{\"description\":\"Chaque jour, il reçoit un mot qu'il doit prononcer avant le coucher du soleil. S'il échoue, il meurt.\",\"goal\":\"Vaincre les villageois.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-loup-bavard-1nf0xpj/\",\"helpTitle\":\"Comment jouer le Loup Bavard ?\",\"name\":\"Loup Bavard\"},\"literateWolf\":{\"description\":\"Chaque jour, une lettre lui est désignée comme interdite. Il doit faire preuve de prudence pour ne pas utiliser cette lettre dans ses messages, sous peine d'être éliminé.\",\"goal\":\"Vaincre les villageois.\",\"name\":\"Loup Lettré\"},\"villager\":{\"description\":\"Sa parole est son seul pouvoir de persuasion pour éliminer les Loups-Garous. Il doit rester à l'affût d'indices, et identifier les coupables.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-simple-villageois-1fl3qcn/\",\"helpTitle\":\"Comment jouer le Simple Villageois ?\",\"name\":\"Simple Villageois\"},\"werewolf\":{\"description\":\"Durant la nuit, les Loups-Garous se réunissent pour voter l'élimination d'un joueur. Pendant la journée, ils doivent éviter d'être démasqués.\",\"goal\":\"Vaincre les villageois.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-loup-garou-h3g5hh/\",\"helpTitle\":\"Comment jouer le Loup-Garou ?\",\"name\":\"Loup-Garou\",\"name_other\":\"Loups-Garous\"},\"whiteWolf\":{\"description\":\"Il se réveille la nuit avec les autres Loups-Garous, qui le croient allié. Une nuit sur deux, il peut dévorer un autre joueur de son choix.\",\"goal\":\"Finir seul survivant.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-loup-blanc-ldvctb/\",\"helpTitle\":\"Comment jouer le Loup Blanc ?\",\"name\":\"Loup Blanc\"},\"witch\":{\"description\":\"Chaque nuit, elle se réveille et peut utiliser l'une de ses deux potions : soigner la victime des Loups-Garous, ou tuer quelqu’un.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-la-sorciere-1vt9r64/\",\"helpTitle\":\"Comment jouer la Sorcière ?\",\"name\":\"Sorcière\"},\"healerWitch\":{\"description\":\"Chaque nuit, elle se réveille et peut utiliser l'une de ses deux potions pour soigner la victime des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Guérisseuse\"},\"poisonerWitch\":{\"description\":\"Chaque nuit, elle se réveille et peut utiliser l'une de ses deux potions pour empoisonner un joueur.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Empoisonneuse\"},\"rumplestiltskin\":{\"description\":\"Chaque nuit, il désigne un joueur et tente de deviner son rôle. Si sa prédiction est juste, le joueur est éliminé. Sinon, la cible peut essayer de découvrir son identité, et s’il est démasqué, il meurt.\",\"goal\":\"Eliminer tous les joueurs.\",\"name\":\"Nain Tracassin\"}}},\"loading\":{\"microphone\":\"Microphone\",\"activateMicrophone\":\"Pour rejoindre cette partie, active ton micro.\",\"tips\":[\"🧐 Sois attentif aux paroles des autres joueurs pour débusquer les loups.\",\"🏅 Si tu es élu maire, tu pourras départager en cas d’égalité sur les votes.\",\"🐱‍👤 Attention si tu fais un vote ninja, tu cours le risque de te faire tuer par la suite.\",\"🚪 Même si tu quittes ta partie après ta mort, tu remporteras ton expérience.\",\"🎲 Les personnages ne sont pas au même emplacement pour tout le monde.\",\"🏅 Être maire peut s’avérer dangereux et inciter les autres joueurs à te tuer.\",\"🐱‍👤 Lorsque tu “vote ninja”, donne une bonne explication ou tu risques de te faire tuer.\",\"🧔 Dictateur : Jouer ton rôle dès le premier tour n’est pas forcément stratégique.\",\"🧙‍♀️ Sorcière : Il n’est pas conseillé d’utiliser sa potion de mort la première nuit.\",\"🧙‍♀️ Sorcière : Attention à qui tu sauves la nuit, ça peut être un loup qui tente de s’innocenter !\",\"🧙‍♀️ Sorcière : Sois sûr(e) de toi avant d’utiliser ta potion pour ne pas désavantager ton camp !\",\"🤫 Dévoiler son rôle augmente les chances de se faire tuer par les loups.\",\"👧 Petite-fille : Porte attention à la manière dont écrivent les loups.\",\"🐺 Loup noir : Ne pas infecter dès la première nuit permet d’infecter stratégiquement.\",\"💘 Cupidon : Attention à ne pas te faire avoir par ton propre couple en partie !\",\"💖 Lorsque tu es en couple tu as accès à un chat privé avec ton partenaire !\",\"💖 Il te faudra ruser et faire preuves de toutes les tromperies possibles pour gagner en couple !\",\"🏹 Chasseur : Attendre quelques secondes avant de tirer permet d’obtenir des informations utiles.\",\"🐺 Il ne faut en aucun cas dévoiler les autres loups lorsque tu es loup.\",\"🐺 En cas d’égalité lors du vote des loups, la victime est choisie aléatoirement.\",\"🐺 Un village qui ne prend pas de décision le jour c’est un avantage pour les loups.\",\"🥧 Chaperon rouge : Attention tu n’es plus protégée si le chasseur est infecté !\",\"🥧 Chaperon rouge : Tu ne peux pas être infectée tant que le chasseur est en vie.\",\"🎯 Fais attention au mercenaire la première journée !\",\"🤔 Pense à bien suivre la partie, ton vote la journée peut changer la donne !\",\"🤔 Contre-voter un joueur sans te défendre peut ne pas tourner en ta faveur !\",\"🤔 Voter quelqu’un sans raison précise n’est pas forcément une très bonne idée.\",\"🤔 L’élément clé pour gagner une partie est de bien savoir tirer parti de son rôle !\",\"📝 Lorsque tu signales quelqu’un pense bien à expliquer pourquoi tu le signales !\",\"📝 Si un joueur ne respecte pas le règlement n’hésite pas à le signaler !\",\"❌ Ne rejoins pas une partie si tu n’es pas sûr(e) d’avoir le temps de la jouer !\",\"❌ L’utilisation de logiciels de diffusion de son en partie vocale est interdite !\",\"❌ Il est interdit de tenter de se suicider dans le but de quitter une partie !\",\"❌ Le partage de compte ou la création de plusieurs compte .\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-cupidon-j6w456/\",\"helpTitle\":\"Comment jouer le Cupidon ?\",\"name\":\"Cupidon\"},\"dictator\":{\"description\":\"Une fois dans la partie, il peut prendre le contrôle du vote du village. S'il fait exécuter un Loup-Garou, il devient Maire. Sinon, il meurt.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-dictateur-1fzbatc/\",\"helpTitle\":\"Comment jouer le Dictateur ?\",\"name\":\"Dictateur\"},\"gravedigger\":{\"description\":\"À sa mort, le Fossoyeur creuse la tombe d'un joueur de son choix et annonce son nom ainsi que celui d'un joueur aléatoire du camp opposé, révélant ainsi un Loup-Garou parmi eux.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-fossoyeur-bfxwr/\",\"helpTitle\":\"Comment jouer le Fossoyeur ?\",\"name\":\"Fossoyeur\"},\"guard\":{\"description\":\"Chaque nuit, il protège un joueur d'une éventuelle attaque des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-garde-wfyyyv/\",\"helpTitle\":\"Comment jouer le Garde ?\",\"name\":\"Garde\"},\"heir\":{\"description\":\"La première nuit, il désigne un joueur qui lui lèguera son rôle à sa mort.\",\"goal\":\"Vaincre les Loups-Garous tant qu'il ne reçoit pas de nouveau rôle.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-lheritier-1xyp9n7/\",\"helpTitle\":\"Comment jouer l'Héritier ?\",\"name\":\"Héritier\"},\"plunderer\":{\"description\":\"Il obtient le rôle du premier joueur mort et peut utiliser ses pouvoirs pour le reste de la partie.\",\"goal\":\"Vaincre les Loups-Garous tant qu'il ne reçoit pas de nouveau rôle.\",\"name\":\"Pillard\"},\"hunter\":{\"description\":\"À sa mort, il peut choisir un autre joueur à entraîner avec lui dans la tombe.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-chasseur-nvabl5/\",\"helpTitle\":\"Comment jouer le Chasseur ?\",\"name\":\"Chasseur\"},\"littleGirl\":{\"description\":\"La nuit, elle espionne discrètement les Loups-Garous pendant leurs discussions.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-la-petite-fille-seetxt/\",\"helpTitle\":\"Comment jouer la Petite Fille ?\",\"name\":\"Petite Fille\"},\"mentalist\":{\"description\":\"Il perçoit l'issue du vote du village 30 secondes avant sa fin et communique si elle est favorable ou non.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-mentaliste-1ewmwy1/\",\"helpTitle\":\"Comment jouer le Mentaliste ?\",\"name\":\"Mentaliste\"},\"mercenary\":{\"description\":\"Le premier jour, son but est de tuer la cible qui lui est attribuée. S'il réussit, il gagne la partie instantanément. Sinon, il devient villageois.\",\"goal\":\"Éliminer sa cible, ou vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-mercenaire-n90rj6/\",\"helpTitle\":\"Comment jouer le Mercenaire ?\",\"name\":\"Mercenaire\"},\"necromencer\":{\"description\":\"La nuit, il peut communiquer avec les morts pour obtenir des informations précieuses.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-necromancien-14brfr8/\",\"helpTitle\":\"Comment jouer le Nécromancien ?\",\"name\":\"Nécromancien\"},\"pyromancer\":{\"description\":\"Chaque nuit, il a le choix entre entreposer un tonneau de feu grégeois chez un joueur, ou déclencher leur explosion.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-pyromancien-11rvc0r/\",\"helpTitle\":\"Comment jouer le Pyromancien ?\",\"name\":\"Pyromancien\"},\"redRidingHood\":{\"description\":\"Tant que le Chasseur est en vie, elle est protégée contre les attaques des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-chaperon-rouge-1v0h5k0/\",\"helpTitle\":\"Comment jouer le Chaperon Rouge ?\",\"name\":\"Chaperon Rouge\"},\"pinkRidingHood\":{\"description\":\"Tant que le couple est en vie, elle est protégée contre les attaques des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Chaperon Rose\"},\"blueRidingHood\":{\"description\":\"Tant qu'un villageois est en vie, il est protégé contre les attaques des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Chaperon Bleu\"},\"wolfRidingHood\":{\"description\":\"Tant que le Loup Noir est en vie, elle est protégée contre les votes des villageois.\",\"goal\":\"Vaincre les villageois.\",\"name\":\"Chaperon Loup\"},\"seer\":{\"description\":\"Chaque nuit elle peut découvrir le rôle d'un joueur qu'elle aura choisi. Elle doit aider les villageois sans se faire démasquer.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-la-voyante-1903qy5/\",\"helpTitle\":\"Comment jouer la Voyante ?\",\"name\":\"Voyante\"},\"talkativeSeer\":{\"description\":\"Chaque nuit, elle découvre le rôle d'un joueur et le révèle automatiquement à tout le village au lever du jour.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Voyante Bavarde\"},\"auraSeer\":{\"description\":\"Chaque nuit, la Voyante d'Aura peut connaître l'Aura d'un joueur. Une Aura obscure indique un rôle capable de tuer.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Voyante d'Aura\"},\"sickRat\":{\"description\":\"Chaque nuit, il peut contaminer deux joueurs. Il gagne la partie lorsque tous les joueurs sont atteints par la maladie.\",\"goal\":\"Contaminer tous les joueurs.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-rat-malade-v2gji3/\",\"helpTitle\":\"Comment jouer le Rat Malade ?\",\"name\":\"Rat Malade\"},\"talkativeWolf\":{\"description\":\"Chaque jour, il reçoit un mot qu'il doit prononcer avant le coucher du soleil. S'il échoue, il meurt.\",\"goal\":\"Vaincre les villageois.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-loup-bavard-1nf0xpj/\",\"helpTitle\":\"Comment jouer le Loup Bavard ?\",\"name\":\"Loup Bavard\"},\"literateWolf\":{\"description\":\"Chaque jour, une lettre lui est désignée comme interdite. Il doit faire preuve de prudence pour ne pas utiliser cette lettre dans ses messages, sous peine d'être éliminé.\",\"goal\":\"Vaincre les villageois.\",\"name\":\"Loup Lettré\"},\"villager\":{\"description\":\"Sa parole est son seul pouvoir de persuasion pour éliminer les Loups-Garous. Il doit rester à l'affût d'indices, et identifier les coupables.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-simple-villageois-1fl3qcn/\",\"helpTitle\":\"Comment jouer le Simple Villageois ?\",\"name\":\"Simple Villageois\"},\"werewolf\":{\"description\":\"Durant la nuit, les Loups-Garous se réunissent pour voter l'élimination d'un joueur. Pendant la journée, ils doivent éviter d'être démasqués.\",\"goal\":\"Vaincre les villageois.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-loup-garou-h3g5hh/\",\"helpTitle\":\"Comment jouer le Loup-Garou ?\",\"name\":\"Loup-Garou\",\"name_other\":\"Loups-Garous\"},\"whiteWolf\":{\"description\":\"Il se réveille la nuit avec les autres Loups-Garous, qui le croient allié. Une nuit sur deux, il peut dévorer un autre joueur de son choix.\",\"goal\":\"Finir seul survivant.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-le-loup-blanc-ldvctb/\",\"helpTitle\":\"Comment jouer le Loup Blanc ?\",\"name\":\"Loup Blanc\"},\"witch\":{\"description\":\"Chaque nuit, elle se réveille et peut utiliser l'une de ses deux potions : soigner la victime des Loups-Garous, ou tuer quelqu’un.\",\"goal\":\"Vaincre les Loups-Garous.\",\"helpLink\":\"https://help.wolfy.net/fr/article/jouer-la-sorciere-1vt9r64/\",\"helpTitle\":\"Comment jouer la Sorcière ?\",\"name\":\"Sorcière\"},\"healerWitch\":{\"description\":\"Chaque nuit, elle se réveille et peut utiliser l'une de ses deux potions pour soigner la victime des Loups-Garous.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Guérisseuse\"},\"poisonerWitch\":{\"description\":\"Chaque nuit, elle se réveille et peut utiliser l'une de ses deux potions pour empoisonner un joueur.\",\"goal\":\"Vaincre les Loups-Garous.\",\"name\":\"Empoisonneuse\"},\"rumplestiltskin\":{\"description\":\"Chaque nuit, il désigne un joueur et tente de deviner son rôle. Si sa prédiction est juste, le joueur est éliminé. Sinon, la cible peut essayer de découvrir son identité, et s’il est démasqué, il meurt.\",\"goal\":\"Eliminer tous les joueurs.\",\"name\":\"Nain Tracassin\"}}},\"loading\":{\"microphone\":\"Microphone\",\"activateMicrophone\":\"Pour rejoindre cette partie, active ton micro.\",\"tips\":[\"🧐 Sois attentif aux paroles des autres joueurs pour débusquer les loups.\",\"🏅 Si tu es élu maire, tu pourras départager en cas d’égalité sur les votes.\",\"🐱‍👤 Attention si tu fais un vote ninja, tu cours le risque de te faire tuer par la suite.\",\"🚪 Même si tu quittes ta partie après ta mort, tu remporteras ton expérience.\",\"🎲 Les personnages ne sont pas au même emplacement pour tout le monde.\",\"🏅 Être maire peut s’avérer dangereux et inciter les autres joueurs à te tuer.\",\"🐱‍👤 Lorsque tu “vote ninja”, donne une bonne explication ou tu risques de te faire tuer.\",\"🧔 Dictateur : Jouer ton rôle dès le premier tour n’est pas forcément stratégique.\",\"🧙‍♀️ Sorcière : Il n’est pas conseillé d’utiliser sa potion de mort la première nuit.\",\"🧙‍♀️ Sorcière : Attention à qui tu sauves la nuit, ça peut être un loup qui tente de s’innocenter !\",\"🧙‍♀️ Sorcière : Sois sûr(e) de toi avant d’utiliser ta potion pour ne pas désavantager ton camp !\",\"🤫 Dévoiler son rôle augmente les chances de se faire tuer par les loups.\",\"👧 Petite-fille : Porte attention à la manière dont écrivent les loups.\",\"🐺 Loup noir : Ne pas infecter dès la première nuit permet d’infecter stratégiquement.\",\"💘 Cupidon : Attention à ne pas te faire avoir par ton propre couple en partie !\",\"💖 Lorsque tu es en couple tu as accès à un chat privé avec ton partenaire !\",\"💖 Il te faudra ruser et faire preuves de toutes les tromperies possibles pour gagner en couple !\",\"🏹 Chasseur : Attendre quelques secondes avant de tirer permet d’obtenir des informations utiles.\",\"🐺 Il ne faut en aucun cas dévoiler les autres loups lorsque tu es loup.\",\"🐺 En cas d’égalité lors du vote des loups, la victime est choisie aléatoirement.\",\"🐺 Un village qui ne prend pas de décision le jour c’est un avantage pour les loups.\",\"🥧 Chaperon rouge : Attention tu n’es plus protégée si le chasseur est infecté !\",\"🥧 Chaperon rouge : Tu ne peux pas être infectée tant que le chasseur est en vie.\",\"🎯 Fais attention au mercenaire la première journée !\",\"🤔 Pense à bien suivre la partie, ton vote la journée peut changer la donne !\",\"🤔 Contre-voter un joueur sans te défendre peut ne pas tourner en ta faveur !\",\"🤔 Voter quelqu’un sans raison précise n’est pas forcément une très bonne idée.\",\"🤔 L’élément clé pour gagner une partie est de bien savoir tirer parti de son rôle !\",\"📝 Lorsque tu signales quelqu’un pense bien à expliquer pourquoi tu le signales !\",\"📝 Si un joueur ne respecte pas le règlement n’hésite pas à le signaler !\",\"❌ Ne rejoins pas une partie si tu n’es pas sûr(e) d’avoir le temps de la jouer !\",\"❌ L’utilisation de logiciels de diffusion de son en partie vocale est interdite !\",\"❌ Il est interdit de tenter de se suicider dans le but de quitter une partie !\",\"❌ Le partage de compte ou la création de plusieurs comptes sont interdits.\",\"🔊 Tu as la possibilité de mute un joueur via l’interface quand tu passes ta souris sur son pseudo !\",\"🔊 Il va te falloir ruser et faire de ta parole une force pour te démarquer en partie vocale !\",\"🔊 Assure-toi que ton micro est fonctionnel avant d’entrer dans une partie vocale !\",\"🐺 Loup blanc : Tuer l’infecté au lieu d’un simple loup permet d’éliminer un danger potentiel.\",\"🐺 Loup blanc : Tu ne peux pas gagner avec les loups, tu dois gagner seul !\",\"🛡️ Garde : Protéger quelqu’un la nuit l’empêche de se faire infecter !\",\"🛡️ Garde : Pense à protéger les joueurs qui semblent avoir un rôle important !\",\"⚰️ Fossoyeur : Il est utile de te sacrifier lorsqu’il ne reste qu’un seul loup !\",\"⚰️ Fossoyeur : Si possible, sélectionne un joueur innocenté afin de faciliter l’identification du loup !\",\"🧠 Mentaliste : Reste discret vis à vis de ton rôle afin de piéger le plus de loups.\",\"🔮 Voyante : Cherche à débusquer le plus de loups possible avant de te dévoiler !\",\"💬 Loup bavard : Le mot journalier peut être placé dans la raison de vote et la présentation de maire !\",\"💬 Loup bavard : Tu peux placer ton mot dans un autre mot, exemple : roi → croire\",\"💬 Loup bavard : Si tu penses te faire démasquer avec un mot, place le rapidement à quelques secondes de la fin des votes.\"]},\"ranks\":{\"PLAYER\":\"Joueur\",\"ALPHA\":\"Alpha\",\"FAMOUS\":\"Célébrité\",\"VOLUNTEER\":\"Volontaire\",\"STAFF\":\"Équipe\",\"MOD\":\"Modération\",\"ADMIN\":\"Équipe\"},\"date\":{\"ago\":\"{{date, timeElapsed}}\",\"days\":{\"short\":{\"0\":\"dim\",\"1\":\"lun\",\"2\":\"mar\",\"3\":\"mer\",\"4\":\"jeu\",\"5\":\"ven\",\"6\":\"sam\"},\"long\":{\"0\":\"dimanche\",\"1\":\"lundi\",\"2\":\"mardi\",\"3\":\"mercredi\",\"4\":\"jeudi\",\"5\":\"vendredi\",\"6\":\"samedi\"}},\"week\":\"{{count}} sem.\",\"week_one\":\"{{count}} sem.\",\"month\":\"{{count}} mois\",\"month_one\":\"{{count}} mois\",\"year\":\"{{count}} ans\",\"year_one\":\"{{count}} an\",\"timeLeft\":{\"day\":{\"short\":\"{{count}} jour\",\"short_other\":\"{{count}} jours\",\"full\":\"{{count}} jour restant\",\"full_other\":\"{{count}} jours restants\"},\"hour\":{\"short\":\"{{count}} heure\",\"short_other\":\"{{count}} heures\",\"full\":\"{{count}} heure restante\",\"full_other\":\"{{count}} heures restantes\"}}}},\"web\":{\"title\":\"Hub\",\"menu\":{\"skin\":\"Mon sk
